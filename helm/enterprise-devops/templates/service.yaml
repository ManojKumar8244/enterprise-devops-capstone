apiVersion: v1
kind: Service

metadata:

  name: enterprise-service

  namespace: {{ .Release.Namespace }}

spec:

  type: {{ .Values.service.type }}

  selector:

    app: {{ include "enterprise-devops.name" . }}

  ports:

    - protocol: TCP

      port: {{ .Values.service.port }}

      targetPort: {{ .Values.service.targetPort }}
