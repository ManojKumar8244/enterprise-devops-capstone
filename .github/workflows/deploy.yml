name: Enterprise Deployment Pipeline

on:
  push:
    branches:
      - feature/terraform
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:

      ##########################################################
      # Checkout
      ##########################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ##########################################################
      # Configure AWS
      ##########################################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      ##########################################################
      # Retrieve Database Secret
      ##########################################################

      - name: Retrieve Database Secret
        run: |
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "${{ secrets.AWS_SECRET_NAME }}" \
            --query SecretString \
            --output text)

          DB_USERNAME=$(echo "$SECRET" | jq -r '.username')
          DB_PASSWORD=$(echo "$SECRET" | jq -r '.password')

          echo "DB_USERNAME=$DB_USERNAME" >> $GITHUB_ENV
          echo "DB_PASSWORD=$DB_PASSWORD" >> $GITHUB_ENV

      ##########################################################
      # Verify Secret
      ##########################################################

      - name: Verify Secret
        run: |
          echo "Database Username: $DB_USERNAME"

          if [ -n "$DB_PASSWORD" ]; then
            echo "Database Password retrieved successfully."
          else
            echo "Database Password not found!"
            exit 1
          fi

      ##########################################################
      # Docker Build
      ##########################################################

      - name: Build Docker Image
        run: |
          docker build \
            --build-arg DB_USERNAME=$DB_USERNAME \
            --build-arg DB_PASSWORD=$DB_PASSWORD \
            -t enterprise-app .

      ##########################################################
      # Deployment
      ##########################################################

      - name: Deploy
        run: |
          echo "Deploying Application..."