name: Retrieve AWS Secrets

on:
  workflow_dispatch:

jobs:

  retrieve-secret:

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Install jq
      run: sudo apt-get update && sudo apt-get install -y jq

    - name: Retrieve Secret
      run: |

        SECRET=$(aws secretsmanager get-secret-value \
        --secret-id ${{ secrets.DATABASE_SECRET_NAME }} \
        --query SecretString \
        --output text)

        DB_USERNAME=$(echo "$SECRET" | jq -r '.username')

        DB_PASSWORD=$(echo "$SECRET" | jq -r '.password')

        echo "DB_USERNAME=$DB_USERNAME" >> $GITHUB_ENV

        echo "DB_PASSWORD=$DB_PASSWORD" >> $GITHUB_ENV

    - name: Verify Secret Retrieved
      run: |

        echo "Database Username Retrieved Successfully"

        echo "Password Length: ${#DB_PASSWORD}"
